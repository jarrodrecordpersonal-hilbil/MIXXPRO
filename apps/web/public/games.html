<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bourbon Games · MIXXWAVE</title><link rel="stylesheet" href="/style.css"><style>body{background:#111915;color:#f7f1e3}.game-home{max-width:900px;margin:auto;padding:28px 18px}.game-home header{text-align:center;margin:30px 0}.game-home h1{font-size:clamp(38px,9vw,72px)}.game-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.game-panel{overflow-wrap:anywhere;background:#1b241f;border:1px solid #ffffff25;border-radius:16px;padding:18px}.pick{display:flex;gap:8px;flex-wrap:wrap}.pick button{white-space:normal;overflow-wrap:anywhere;flex:1;min-width:120px}.standings span{min-width:0}.standings b{flex-shrink:0}.standings div{gap:12px;display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #ffffff18}@media(max-width:620px){.game-grid{grid-template-columns:1fr}}</style></head><body><main class="game-home"><header><div class="eyebrow">BOURBON GAMES · LIVE ON MIXXWAVE</div><h1 id="title">Proof Trials</h1><p id="status">Loading shared event…</p><div id="countdown" style="font-size:clamp(34px,10vw,68px);font-weight:800"></div></header><section id="resume" class="game-panel"><h2>Already playing on another device?</h2><form id="resume-form"><label>Resume code<input name="code" maxlength="20" autocomplete="one-time-code"></label><button class="btn secondary" type="submit">Resume my game</button></form></section><section id="join" class="game-panel"><h2>Join the tasting</h2><form id="join-form"><label>Display name<input name="name" maxlength="40" required></label><button class="btn" type="submit">Join event</button></form></section><section id="play" class="hidden"><div class="game-panel"><button id="link-device" class="btn secondary" type="button">Play on another device</button><p id="link-code"></p></div><div id="matchups" class="game-grid"></div><section class="game-panel section"><h2>Standings</h2><p>Same event, whether you joined from a venue or home.</p><div id="standings" class="standings"></div></section></section></main><script type="module" src="/games.mjs"></script></body></html>
